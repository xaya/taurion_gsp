syntax = "proto2";
option cc_enable_arenas = true;

package pxd.proto;

/**
 * General data associated to an account.
 */
message Account
{

  /**
   * The number of characters killed by the account in total.
   */
  optional uint32 kills = 1;

  /**
   * The fame of this account.
   */
  optional uint32 fame = 2;

  /**
   * Balance of vCHI for this account.
   */
  optional uint64 balance = 3;

  /**
   * Balance of vCHI minted through the burnsale, which corresponds to
   * the balance that will be carried over to the full game.
   */
  optional uint64 burnsale_balance = 4;

  /**
   * Jobs-board completion counters: display-only vetting signals consumed by
   * NO consensus rule.  Wraps at the declared widths are deterministic and
   * explicitly accepted.  Rationale and threat model: see BumpJobStats
   * (src/jobs_predicates.cpp).
   */
  optional uint32 jobs_completed = 5;
  reserved 6;  // was jobs_failed (no kept type produces a worker forfeit)
  optional uint64 jobs_value_completed = 7;

  reserved 8;  // was jobs_failed_as_poster (removed with the delivery types)

  /**
   * Escrow-DEAL reputation counters, kept DISJOINT from the jobs/wanted
   * counters above (red-team T7).  Bumped for the worker on ANY tax-bearing
   * settlement with p>0, so a Phase-2 reputation layer MUST read "completed"
   * as "settled with the worker earning something", never as "delivered in
   * full".  Same width/wrap semantics and display-only status as the jobs
   * counters; rationale and scaling: see BumpDealStats.
   */
  optional uint32 deals_completed = 9;
  optional uint64 deals_value_completed = 10;

  /**
   * The POSTER side of the same settlements: deals this account posted that
   * released value to a worker, and the total so released.  Gated on the very
   * same tax anchor as the worker counters above (see BumpDealStats), so the
   * two sides of one settlement move together or not at all.  A poster's
   * record is what a prospective worker vets before staking collateral.
   */
  optional uint32 deals_posted_completed = 11;
  optional uint64 deals_posted_value = 12;

  /**
   * Deals that ended in a DISPUTE -- an arbiter ruling or the blunt 50/50
   * fallback -- bumped for BOTH parties, since which side was at fault is
   * exactly what consensus cannot know.  Deliberately NOT tax-gated: the
   * dispute happened whether or not the pot was large enough to pay tax, and
   * unlike the completion counters this one is not worth farming upwards.
   */
  optional uint32 deals_disputed = 13;

  /**
   * The ARBITER's record: disputes this account was bound to and actually
   * ruled, against those it let time out into the 50/50 fallback (the
   * GHOST_SPLIT mode, which also covers no-arbiter disputes -- those bump
   * NEITHER counter, since no arbiter was ever hired).  Ghosting is the one
   * arbiter failure consensus can observe, so it is recorded beside the
   * rulings rather than inferred from their absence.
   */
  optional uint32 arbiter_rulings = 14;
  optional uint32 arbiter_ghosted = 15;

}
